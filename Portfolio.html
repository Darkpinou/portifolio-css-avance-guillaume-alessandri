<script>
    const mlgButton = document.getElementById('mlgButton');
    const mlgMeme = document.getElementById('mlgMeme');
    const mlgAudio = document.getElementById('mlgAudio');
    const mlgGif = mlgMeme.querySelector('img'); 
  
    mlgButton.addEventListener('click', () => {
      if (mlgMeme.style.display === 'none') {
        mlgMeme.style.display = 'block';
        mlgAudio.currentTime = 0;
        mlgAudio.play();
        mlgGif.style.width = "100%";  
        mlgGif.style.height = "100vh"; 
  
        
        setTimeout(() => {
          mlgMeme.style.display = 'none';
          mlgAudio.pause();
          mlgAudio.currentTime = 0;
        }, 9000); 
      } else {
        mlgMeme.style.display = 'none';
        mlgAudio.pause();
        mlgAudio.currentTime = 0;
      }
    });
</script>

<img id="scrollMeme" src="wtc.jpg" alt="Antoine daniel le plus beau wsh " />

<script>
    let triggered = false;

    window.addEventListener("scroll", () => {
      const scrollTop = window.scrollY;
      const winHeight = window.innerHeight;
      const docHeight = document.documentElement.scrollHeight;
  
      if (scrollTop + winHeight >= docHeight - 5) {
        window.addEventListener("wheel", onOverScroll);
      }
    });
  
    function onOverScroll(e) {
      if (e.deltaY > 0 && !triggered) {
        const img = document.getElementById("scrollMeme");
        img.classList.add("show");
        triggered = true;
  
        setTimeout(() => {
          img.classList.remove("show");
          triggered = false;
        }, 2000);
  
        window.removeEventListener("wheel", onOverScroll);
      }
    }
</script>
